<style>
/* Layout concept: one fixed 1920x1080 stage, scaled to fit any screen.
   Every layer sits at the coordinates of the hand-drawn art, so the
   finished frame matches the artwork pixel for pixel. */
:root {
  --paper: #ffffff;
  --ink: #000000;
  --lilac: #d5c7ff;
  --serif: "Noto Serif TC", "Songti TC", "Noto Serif CJK TC", "PMingLiU", serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--serif);
  overflow: hidden;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
/* the toolbar background runs the full width of the screen, even where the 16:9 stage leaves side margins */
#barBg {
  position: fixed; left: 0; right: 0; top: 0; height: 0; z-index: 0;
  background: linear-gradient(to bottom, var(--lilac) 0 91.765%, var(--ink) 91.765% 100%);
}
#fit { position: relative; z-index: 1; flex: none; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0;
  width: 1920px; height: 1080px;
  transform-origin: 0 0;
  background: transparent;
  cursor: pointer;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.layer { position: absolute; display: block; max-width: none; pointer-events: none; -webkit-user-drag: none; }

/* top bar */
#bar {
  position: absolute; left: 0; top: 0; width: 1920px; height: 85px; z-index: 50;
  background: linear-gradient(to bottom, var(--lilac) 0 78px, var(--ink) 78px 85px);
}
#screenName {
  position: absolute; left: 44px; top: 0; line-height: 78px;
  font-size: 34px; font-weight: 700; letter-spacing: 0.08em;
  opacity: 0; transition: opacity .25s;
}
.is-select #screenName { opacity: 1; }
#exitBtn {
  position: absolute; right: 36px; top: 6px; width: 59px; height: 66px;
  padding: 0; border: 0; background: none; cursor: pointer;
  transition: transform .15s;
}
#exitBtn img { width: 59px; height: 66px; display: block; max-width: none; }
#exitBtn:hover { transform: translateX(4px); }
#exitBtn:focus-visible { outline: 4px solid var(--ink); outline-offset: 6px; }

/* title layers */
#titleLayer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
.is-select #titleLayer { display: none; }
#ship { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 863px 749px; will-change: transform; }
#ship .fire { transform-origin: 100% 55%; visibility: hidden; will-change: transform; }
#ship #qq { transform-origin: 50% 100%; will-change: transform; }
#logoWrap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 940px 389px; opacity: 0; will-change: transform, opacity; }
#star { transform-origin: 50% 50%; opacity: 0; will-change: transform; }
#hint {
  position: absolute; left: 965px; top: 1000px; transform: translateX(-50%);
  font-size: 40px; font-weight: 500; line-height: 48px; white-space: nowrap; opacity: 0;
}

/* character select */
#select {
  position: absolute; left: 0; top: 85px; width: 1920px; height: 995px;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 44px;
  cursor: default;
}
.is-select #select { display: flex; }
#cards { display: flex; gap: 32px; padding-top: 14px; }
.card {
  position: relative; flex: none; width: 440px; height: 604px; padding: 0; margin: 0;
  background: none; border: 0; border-radius: 0; color: var(--ink); font-family: var(--serif);
  text-align: center; cursor: pointer;
  filter: drop-shadow(0 0 0 transparent);
  transition: transform .2s, filter .2s;
}
.card .art { position: absolute; left: 0; top: 0; width: 440px; height: 604px; max-width: none; display: block; pointer-events: none; -webkit-user-drag: none; }
.card:focus-visible { outline: 4px solid var(--ink); outline-offset: 10px; }
.card[aria-checked="true"] { transform: translateY(-14px); filter: drop-shadow(12px 12px 0 var(--lilac)); }
.card .info {
  position: absolute; left: 38px; right: 38px; top: 350px; bottom: 50px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px;
}
/* --k is set by fitCards() so the text always stays inside the frame */
.card .nm { font-size: calc(35px * var(--k, 1)); font-weight: 700; line-height: 1.25; letter-spacing: 0.02em; }
.card .ds { font-size: calc(28px * var(--k, 1)); font-weight: 500; line-height: 1.45; }
.card .nm > span, .card .ds > span { display: block; white-space: nowrap; }
/* cards whose art is not drawn yet: frame drawn in CSS, faint silhouette of the hero */
.card.soon { cursor: default; background: var(--paper); border: 5px solid var(--ink); border-radius: 50px; box-sizing: border-box; }
.card.soon .sil { position: absolute; left: 110px; top: 110px; width: 220px; height: auto; max-width: none; opacity: .12; filter: brightness(0); pointer-events: none; }
.card.soon .tag {
  position: absolute; left: 0; right: 0; top: 322px; font-size: 28px; font-weight: 700; letter-spacing: 0.2em; opacity: .55;
}
.card.soon .info { top: 384px; bottom: 30px; }
#selRow { display: flex; gap: 40px; }
#backBtn, #goBtn {
  font: 700 38px/1 var(--serif); letter-spacing: 0.12em; padding: 30px 64px; color: var(--ink);
  border: 5px solid var(--ink); border-radius: 0; cursor: pointer;
}
#backBtn { background: var(--paper); }
#goBtn { background: var(--lilac); }
#backBtn:focus-visible, #goBtn:focus-visible { outline: 4px solid var(--ink); outline-offset: 6px; }

/* save code */
#saveBtn {
  position: absolute; right: 116px; top: 6px; width: 48px; height: 66px; padding: 0;
  background: none; border: 0; cursor: pointer;
  transition: transform .18s;
}
#saveBtn img { position: absolute; left: 0; top: 0; width: 48px; height: 66px; max-width: none; display: block; }
#saveBtn:hover { transform: scale(1.08) rotate(-4deg); }
[data-label] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
#tip {
  position: absolute; z-index: 70; transform: translateX(-50%); pointer-events: none;
  padding: 8px 20px; background: var(--ink); color: var(--paper);
  font: 700 28px/1.2 var(--serif); letter-spacing: 0.08em; white-space: nowrap;

#saveBtn:focus-visible, #saveModal button:focus-visible, #saveText:focus-visible { outline: 4px solid var(--ink); outline-offset: 5px; }
#saveModal {
  position: absolute; left: 0; top: 85px; width: 1920px; height: 995px; z-index: 55;
  background: rgba(255, 255, 255, 0.94); display: none; align-items: center; justify-content: center; cursor: default;
}

#saveBox p { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.5; }
#saveText {
  width: 100%; height: 190px; box-sizing: border-box; resize: none; padding: 16px 18px;
  font: 500 24px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: var(--paper);
  border: 4px solid var(--ink); border-radius: 0; word-break: break-all;
}
#saveRow { display: flex; gap: 20px; flex-wrap: wrap; }
#saveModal button {
  font: 700 30px/1 var(--serif); letter-spacing: 0.08em; padding: 18px 34px; color: var(--ink);
  background: var(--lilac); border: 5px solid var(--ink); border-radius: 0; cursor: pointer;
}
#saveModal button.plain { background: var(--paper); }
#saveMsg { min-height: 42px; font-size: 28px; font-weight: 700; }

#toast {
  position: absolute; left: 50%; top: 108px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); font-size: 30px; font-weight: 500;
  padding: 14px 34px; border-radius: 999px; white-space: nowrap;
  opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60;
}
#toast.on { opacity: 1; }

/* portrait phones: ask for landscape */
#rotate {
  position: fixed; inset: 0; z-index: 99; background: var(--paper); color: var(--ink);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  font-size: 22px; font-weight: 700; letter-spacing: .1em;
}
#rotate .phone {
  width: 54px; height: 92px; border: 5px solid var(--ink); border-radius: 12px; position: relative;
  animation: turn 2.4s ease-in-out infinite;
}
#rotate .phone::after { content: ""; position: absolute; left: 50%; bottom: 7px; width: 14px; height: 5px; margin-left: -7px; background: var(--ink); border-radius: 3px; }
@keyframes turn { 0%, 25% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } }

/* battle (prototype: 數學家) */
#battle {
  position: absolute; left: 0; top: 85px; width: 1920px; height: 995px; display: none; overflow: hidden; cursor: default;
}
.is-battle #battle { display: block; }
.is-battle #titleLayer, .is-battle #select { display: none; }

  background: var(--paper); border: 4px solid var(--ink);
}

.unit { position: absolute; }
#pl { left: 150px; top: 130px; width: 480px; height: 560px; }
#plArt { position: absolute; left: 70px; top: 0; width: 340px; height: 302px; animation: bob 2.6s ease-in-out infinite; }
#plArt img { width: 100%; height: 100%; display: block; max-width: none; }
#plRed {
  position: absolute; inset: 0; background: #ff3b30; mix-blend-mode: multiply; opacity: 0; pointer-events: none;
  -webkit-mask: url(assets/qq.png) center / 100% 100% no-repeat; mask: url(assets/qq.png) center / 100% 100% no-repeat;
}
#en { left: 1250px; top: 70px; width: 460px; height: 600px; }

#enArt img { width: 100%; height: 100%; display: block; max-width: none; object-fit: contain; }
#enRed { position: absolute; inset: 0; background: #ff3b30; opacity: 0; pointer-events: none; -webkit-mask: url(assets/enemy.png) center / contain no-repeat; mask: url(assets/enemy.png) center / contain no-repeat; }
#enArt.hit #enRed { animation: redOn .55s; }
@keyframes redOn { 0% { opacity: 0; } 25% { opacity: .75; } 100% { opacity: 0; } }
#enArt svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes shake { 0%, 100% { translate: 0 0; } 15% { translate: -22px 4px; } 30% { translate: 20px -4px; } 45% { translate: -16px 3px; } 60% { translate: 12px -2px; } 80% { translate: -6px 0; } }
@keyframes redIn { 0% { opacity: 0; } 25% { opacity: .85; } 100% { opacity: 0; } }
@keyframes redFill { 0% { fill: #fff; } 25% { fill: #ff6a5e; } 100% { fill: #fff; } }
.shake { animation: shake .45s; }
#plRed.on { animation: redIn .6s; }
#enArt.hit svg .body { animation: redFill .55s; }
.bar { position: relative; height: 34px; border: 4px solid var(--ink); background: var(--paper); box-sizing: border-box; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: #ff8e78; transition: width .35s; }
.bar b { position: absolute; left: 0; right: 0; top: 0; line-height: 26px; text-align: center; font-size: 22px; font-weight: 700; }
.bar.ult i { background: var(--lilac); }
.hud { position: absolute; left: 20px; width: 440px; }
#plHud { top: 330px; display: flex; flex-direction: column; gap: 8px; }
#enHud { left: 30px; top: 0; width: 420px; display: flex; flex-direction: column; gap: 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; min-height: 38px; }
.chip { font-size: 22px; font-weight: 700; padding: 3px 12px; border: 3px solid var(--ink); background: var(--paper); white-space: nowrap; }
.chip.lil { background: var(--lilac); }
#enName { font-size: 30px; font-weight: 700; letter-spacing: .05em; }
#intent { display: flex; flex-wrap: wrap; gap: 6px; }
.ip { font-size: 22px; font-weight: 700; padding: 3px 10px; background: var(--ink); color: var(--paper); transition: opacity .2s; }
.ip.on { background: #e0261b; }
.ip.done { opacity: .3; }
.hc.charge { background: var(--lilac); }
.hc.charge .ty { background: var(--paper); }
@keyframes pulse { 50% { transform: scale(1.04); } }
#hand { position: absolute; left: 200px; right: 330px; top: 695px; height: 300px; display: flex; justify-content: center; align-items: flex-end; gap: 12px; }
.hc {
  position: relative; flex: 0 1 200px; min-width: 0; height: 290px; box-sizing: border-box; padding: 14px 10px 10px; text-align: center;
  background: var(--paper); border: 5px solid var(--ink); border-radius: 26px; transition: transform .15s, opacity .2s;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.hc:hover:not(.off) { transform: translateY(-16px); }
.hc.off { opacity: .45; }
.hc .cost { position: absolute; left: -14px; top: -14px; width: 54px; height: 54px; line-height: 48px; border-radius: 50%; border: 4px solid var(--ink); background: var(--lilac); font-size: 30px; font-weight: 700; }
.hc .ty { font-size: 22px; font-weight: 700; letter-spacing: .15em; padding: 2px 12px; border: 3px solid var(--ink); margin-top: 4px; }
.hc.atk .ty { background: #ffd9d1; } .hc.def .ty { background: #d8ecff; } .hc.skill .ty { background: var(--lilac); }

#energy {
  position: absolute; left: 44px; top: 705px; width: 120px; height: 120px; border-radius: 50%; background: var(--lilac); border: 5px solid var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 46px; font-weight: 700; line-height: 1;

}

@keyframes popUp { 0% { opacity: 0; transform: translate(-50%, 30px) scale(.4); } 14% { opacity: 1; transform: translate(-50%, 0) scale(1.18); } 28% { transform: translate(-50%, 0) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -90px) scale(1); } }
#result {

#rGrade { font-size: 260px; font-weight: 700; line-height: 1; }

#rRow { display: flex; gap: 34px; margin-top: 18px; }
#rRow button { font-size: 36px; font-weight: 700; letter-spacing: .1em; padding: 24px 52px; border: 5px solid var(--ink); background: var(--paper); }
#rRow button.pri { background: var(--lilac); }

/* courtyard (rough) */
#yard { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; overflow: hidden; background: #000; }

.is-yard #titleLayer, .is-yard #select, .is-yard #battle { display: none; }
.is-yard #screenName { opacity: 1; }
#yard button { font-family: var(--serif); color: var(--ink); }
.scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; touch-action: none; display: none; }
#yard { touch-action: none; }
.scene.on { display: block; }
.world { position: absolute; left: 0; top: 0; height: 1080px; transform-origin: 0 0; }
.world.anim { transition: transform .5s ease; }
.ymask { position: absolute; top: 0; right: 0; bottom: 0; width: 800px; box-sizing: border-box; padding-right: 70px; display: flex; align-items: center; justify-content: flex-end; background: linear-gradient(to right, rgba(0, 0, 0, 0), rgba(0, 0, 0, .6)); transform: translateX(100%); transition: transform .45s ease; z-index: 20; pointer-events: none; }

.obj { position: absolute; cursor: pointer; }
.obj img { display: block; width: 100%; pointer-events: none; -webkit-user-drag: none; }
.obj .mark { position: absolute; left: 50%; top: -120px; width: 78px; margin-left: -39px; pointer-events: none; animation: ybob 1.4s ease-in-out infinite; display: none; z-index: 5; }
@keyframes ybob { 50% { transform: translateY(-16px); } }
.obj .lbl { position: absolute; left: 50%; bottom: -44px; transform: translateX(-50%); white-space: nowrap; font-size: 28px; font-weight: 700; pointer-events: none; }
.txtobj { box-sizing: border-box; border: 4px dashed var(--ink); border-radius: 24px; background: var(--paper); font-size: 34px; font-weight: 700; line-height: 1.4; text-align: center; display: flex; align-items: center; justify-content: center; padding: 18px; }
.bubble { white-space: pre-line; position: absolute; width: 460px; box-sizing: border-box; padding: 20px 26px; background: var(--paper); border: 4px solid var(--ink); border-radius: 28px; font-size: 34px; font-weight: 500; line-height: 1.45; pointer-events: none; display: none; z-index: 2000; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -18px; width: 28px; height: 28px; margin-left: -14px; background: var(--paper); border-right: 4px solid var(--ink); border-bottom: 4px solid var(--ink); transform: rotate(45deg); }
.rest { visibility: hidden; }
.ybtns { position: absolute; z-index: 2000; display: none; }
.ybtn { display: block; margin: 0 0 14px; font: 700 32px/1 var(--serif); letter-spacing: .06em; padding: 18px 28px; border: 4px solid var(--ink); background: var(--paper); cursor: pointer; white-space: nowrap; }
.ybtn:disabled { opacity: .35; cursor: default; }

.obj.hot { background: transparent; }

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fit = $('fit'), stage = $('stage'), ship = $('ship'), qq = $('qq');
  var fires = ship.querySelectorAll('.fire');
  var logoWrap = $('logoWrap'), ding = $('ding'), star = $('star'), hint = $('hint');
  var toast = $('toast');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  var clamp = function (x, a, b) { return Math.min(b === undefined ? 1 : b, Math.max(a === undefined ? 0 : a, x)); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var smooth = function (a, b, x) { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
  var outBack = function (x) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  var TAU = Math.PI * 2;

  /* Ding's cord: cut from the logo on a clean horizontal row, where the cord is a vertical 7px stroke.
     Each pixel row below the cut is shifted sideways by an amount that grows from 0 at the cut,
     so the cord bends and swings but stays joined to the logo at every moment. */
  var DING_PAD = 28;
  var dctx = ding.getContext('2d'), dingImg = new Image(), dingReady = false, dingA = 0;
  function drawDing(a) {
    if (!dingReady) return;
    var w = dingImg.naturalWidth, h = dingImg.naturalHeight;
    dctx.clearRect(0, 0, ding.width, ding.height);
    if (!a) { dctx.drawImage(dingImg, DING_PAD, 0); return; }
    for (var r = 0; r < h; r++) {
      var u = r / (h - 1);
      dctx.drawImage(dingImg, 0, r, w, 1, DING_PAD + a * Math.pow(u, 1.6), r, w, 1);
    }
  }
  dingImg.onload = function () { dingReady = true; drawDing(dingA); };
  dingImg.src = 'assets/ding.png';

  /* the intro starts only once the phone is held sideways (same condition that shows the rotate hint) */
  var portraitMQ = window.matchMedia('(orientation: portrait) and (max-width: 820px)');
  var lastFrame = performance.now() / 1000;

  /* timeline (seconds) */
  var FLIGHT = 1.9, POP = 0.7, STAR = 1.9, HINT = 2.4, REST = 3.4;
  var P0 = [-1000, 560], C = [-320, 90];   // bottom-left, off screen -> resting spot

  var mode = 'intro', t0 = performance.now() / 1000, leaveT = 0;

  function resize() {
    var w = document.body.clientWidth, h = document.body.clientHeight;
    var s = Math.min(w / 1920, h / 1080);
    fit.style.width = (1920 * s) + 'px';
    fit.style.height = (1080 * s) + 'px';
    stage.style.transform = 'scale(' + s + ')';
    var bg = $('barBg');
    bg.style.top = fit.getBoundingClientRect().top + 'px';
    bg.style.height = (85 * s) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function flightPos(p) {
    var e = 1 - Math.pow(1 - p, 3), u = 1 - e;
    var x = u * u * P0[0] + 2 * u * e * C[0];
    var y = u * u * P0[1] + 2 * u * e * C[1];
    var dx = 2 * u * (C[0] - P0[0]) + 2 * e * (0 - C[0]);
    var dy = 2 * u * (C[1] - P0[1]) + 2 * e * (0 - C[1]);
    return { x: x, y: y, head: Math.atan2(dy, dx) * 180 / Math.PI };
  }

  function frame(ms) {
    var now = ms / 1000;
    var dtf = now - lastFrame; lastFrame = now;
    if (mode === 'intro' && portraitMQ.matches) t0 += dtf;   // hold the intro at its first frame while upright
    var t = now - t0;
    if (mode === 'intro' && t > REST - 0.2) mode = 'title';

    /* ---- the ship: QQ人 plus jet flame ---- */
    var ox = 0, oy = 0, rot = 0, fs = 1, sx = 1, sy = 1;
    var bobR = reduce ? 0 : smooth(FLIGHT * 0.75, FLIGHT + 0.7, t);
    var bx = bobR * 5 * Math.sin(now * TAU / 5.1);
    var by = bobR * 15 * Math.sin(now * TAU / 3.4);
    var brot = bobR * 2.4 * Math.sin(now * TAU / 3.4 + 0.9);
    var flick = 1 + 0.07 * Math.sin(now * 37) + 0.04 * Math.sin(now * 23);

    if (mode === 'leave') {
      var q = clamp((now - leaveT) / 0.9), e3 = q * q * q;
      ox = lerp(0, 1700, e3) + bx * (1 - q);
      oy = lerp(0, -640, e3) + by * (1 - q);
      rot = -26 * smooth(0, 0.5, q) + brot * (1 - q);
      fs = (1 + 0.9 * smooth(0, 0.7, q)) * flick;
      if (q >= 1) { enterSelect(); }
    } else if (reduce) {
      fs = flick;
    } else {
      var p = clamp(t / FLIGHT);
      var f = flightPos(p);
      var dt = Math.max(0, t - FLIGHT);
      ox = f.x + bx;
      oy = f.y + by - 10 * Math.exp(-dt * 4) * Math.sin(dt * 10);
      rot = f.head * 0.7 * (1 - smooth(0.55, 1, p)) + brot;
      fs = (1 + 0.55 * Math.pow(1 - p, 2)) * flick;
      var jel = 0.085 * Math.exp(-dt * 5) * Math.sin(dt * 15);
      sx = 1 + 0.05 * (1 - p) * (1 - p) - jel;
      sy = 1 - 0.04 * (1 - p) * (1 - p) + jel;
    }
    ship.style.transform = 'translate(' + ox.toFixed(1) + 'px,' + oy.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
    qq.style.transform = 'scale(' + sx.toFixed(3) + ',' + sy.toFixed(3) + ')';
    var fi = [0, 1, 2, 1][Math.floor(now * 9) % 4];
    for (var i = 0; i < fires.length; i++) {
      fires[i].style.visibility = i === fi ? 'visible' : 'hidden';
      fires[i].style.transform = 'scale(' + fs.toFixed(3) + ',' + (1 + (fs - 1) * 0.25).toFixed(3) + ')';
    }

    /* ---- logo, dangling Ding, star, hint ---- */
    var fade = mode === 'leave' ? 1 - clamp((now - leaveT) / 0.4) : 1;
    var a = clamp((t - POP) / 0.55);
    logoWrap.style.opacity = (a * fade).toFixed(3);
